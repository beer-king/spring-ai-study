<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Spring AI 학습</title>
    <style>
        body {
          font-family: sans-serif;
          max-width: 700px;
          margin: 50px auto;
          padding: 20px;
        }

        textarea {
          width: 100%;
          box-sizing: border-box;
          padding: 12px;
        }

        button {
          margin-top: 10px;
          padding: 10px 20px;
          cursor: pointer;
        }

        #answer {
          white-space: pre-wrap;
          background: #f5f5f5;
          padding: 20px;
          margin-top: 20px;
          border-radius: 8px;
          min-height: 80px;
        }
    </style>
</head>
<body>

<h2>Spring AI 채팅</h2>

<textarea
        id="question"
        rows="4"
        placeholder="AI에게 질문하세요."
></textarea>

<button id="askBtn" onclick="askAI()">질문하기</button>

<h3>AI 답변</h3>
<div id="answer"></div>

<script>
    async function askAI() {
      const question = document.getElementById('question').value.trim();
      const answer = document.getElementById('answer');
      const button = document.getElementById('askBtn');

      if (!question) {
        alert('질문을 입력하세요.');
        return;
      }

      button.disabled = true;
      answer.textContent = 'AI가 답변을 생성 중입니다...';

      try {
        const params = new URLSearchParams({ question });

        const response = await fetch(`/api/ai/ask?${params}`);

        if (!response.ok) {
          throw new Error(`HTTP 오류: ${response.status}`);
        }

        const data = await response.text();
        answer.textContent = data;

      } catch (error) {
        answer.textContent = `오류 발생: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    }
</script>

</body>
</html>
